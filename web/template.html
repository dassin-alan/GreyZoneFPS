<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GreyZone — 轻量化手机 FPS 原型（浏览器演示版）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #14161a; }
  body { font-family: Consolas, "Courier New", monospace; color: #d8e0d8; -webkit-user-select: none; user-select: none; }
  #gl, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { pointer-events: none; }
  #gl { touch-action: none; }
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
  #touch.left { transform: scaleX(-1); }
  #touch.left > * { transform: scaleX(-1); }
  #stick {
    position: absolute; left: 6vw; bottom: 9vh; width: 30vw; height: 30vw; max-width: 190px; max-height: 190px;
    border: 2px solid rgba(200,220,200,0.28); border-radius: 50%; pointer-events: auto; touch-action: none;
    background: rgba(20,24,28,0.25);
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 42%; height: 42%; border-radius: 50%;
    background: rgba(200,220,200,0.30); transform: translate(-50%,-50%);
  }
  .btn {
    position: absolute; pointer-events: auto; touch-action: none; border: 1px solid rgba(200,220,200,0.35);
    border-radius: 8px; background: rgba(20,24,28,0.42); color: #cfd8cf; font-size: 12px;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 2px;
  }
  .btn.on { background: rgba(120,160,120,0.55); }
  #btn-fire { right: 6vw; bottom: 12vh; width: 20vw; height: 20vw; max-width: 130px; max-height: 130px; border-radius: 50%; font-size: 15px; }
  #btn-scope { right: 27vw; bottom: 22vh; width: 13vw; height: 13vw; max-width: 84px; max-height: 84px; border-radius: 50%; }
  #btn-jump { right: 7vw; bottom: 36vh; width: 13vw; height: 11vw; max-width: 84px; max-height: 70px; }
  #btn-duck { right: 20vw; bottom: 8vh; width: 13vw; height: 11vw; max-width: 84px; max-height: 70px; }
  #btn-walk { right: 34vw; bottom: 12vh; width: 12vw; height: 10vw; max-width: 78px; max-height: 64px; }
  #btn-reload { right: 8vw; bottom: 52vh; width: 12vw; height: 10vw; max-width: 78px; max-height: 64px; }
  #btn-use { right: 34vw; bottom: 25vh; width: 14vw; height: 12vw; max-width: 92px; max-height: 76px; }
  #btn-swap { right: 21vw; bottom: 44vh; width: 12vw; height: 10vw; max-width: 78px; max-height: 64px; }
  #btn-buy { left: 2vw; top: 12vh; width: 15vw; height: 9vw; max-width: 96px; max-height: 58px; }
  #btn-pause { left: 2vw; top: 3vh; width: 15vw; height: 8vw; max-width: 96px; max-height: 52px; }
  .panel {
    position: fixed; display: none; background: rgba(14,16,20,0.94); border: 1px solid rgba(160,190,160,0.35);
    border-radius: 10px; padding: 16px 18px; z-index: 10;
  }
  #buy { right: 3vw; top: 6vh; width: min(420px, 62vw); }
  .buy-row { padding: 7px 10px; margin: 4px 0; background: rgba(60,72,60,0.35); border-radius: 6px; cursor: pointer; font-size: 14px; }
  .buy-row:hover { background: rgba(96,120,96,0.5); }
  .buy-row.dim { opacity: 0.35; cursor: default; }
  #buy-money { color: #78d878; margin-bottom: 8px; font-size: 15px; }
  #buy-have { color: #9aa39a; margin-top: 8px; font-size: 12px; }
  #tuner { left: 3vw; bottom: 6vh; width: min(430px, 66vw); max-height: 72vh; overflow: auto; }
  .t-title { color: #e8c46a; margin-bottom: 10px; font-size: 14px; }
  .t-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; }
  .t-row label { flex: 0 0 148px; color: #b9c4b9; }
  .t-row input[type=range] { flex: 1; }
  .t-row span { flex: 0 0 44px; text-align: right; color: #e8e8e8; }
  .t-row button { background: rgba(80,100,80,0.5); color: #dfe8df; border: 1px solid rgba(180,200,180,0.4); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #pause { left: 50%; top: 50%; transform: translate(-50%,-50%); text-align: center; width: min(420px, 80vw); }
  #pause h2 { font-size: 18px; margin-bottom: 10px; color: #e8c46a; }
  #pause p { font-size: 12px; line-height: 1.7; color: #b9c4b9; text-align: left; }
  #pause .key { color: #e8e8e8; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>

<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div class="btn" id="btn-fire">FIRE</div>
  <div class="btn" id="btn-scope">SCOPE</div>
  <div class="btn" id="btn-jump">JUMP</div>
  <div class="btn" id="btn-duck">DUCK</div>
  <div class="btn" id="btn-walk">WALK</div>
  <div class="btn" id="btn-reload">RELOAD</div>
  <div class="btn" id="btn-use">USE</div>
  <div class="btn" id="btn-swap">SWAP</div>
  <div class="btn" id="btn-buy">BUY</div>
  <div class="btn" id="btn-pause">||</div>
</div>

<div class="panel" id="buy">
  <div id="buy-money">资金 $0</div>
  <div id="buy-list"></div>
  <div id="buy-have">当前: -</div>
</div>

<div class="panel" id="tuner"></div>

<div class="panel" id="pause">
  <h2>GREYZONE — 暂停</h2>
  <p>
    <span class="key">WASD</span> 移动 · <span class="key">鼠标</span> 视角 · <span class="key">左键</span> 开火 · <span class="key">右键</span> 开镜<br>
    <span class="key">R</span> 换弹 · <span class="key">1/2/Q</span> 切枪 · <span class="key">Shift</span> 静步 · <span class="key">Ctrl</span> 蹲 · <span class="key">Space</span> 跳<br>
    <span class="key">E</span> 安放/拆除 · <span class="key">B</span> 购买 · <span class="key">F1</span> 调参（急停/后坐力）<br>
    回合制爆破：带包去 A/B 点长按 E 安放，CT 拆包；经济买枪；先到 8 胜。
  </p>
  <p style="margin-top:10px;color:#e8a0a0">点击画面继续（移动端点右上角 || 恢复）</p>
</div>

<script>/*__SIM__*/</script>
<script>/*__GL__*/</script>
<script>/*__GAME__*/</script>
</body>
</html>
